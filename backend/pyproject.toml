[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "relay-integration-hub"
version = "1.0.0"
description = "Relay: webhook integration hub - receive, verify, normalize and reliably deliver business events (Tilda, amoCRM, Bitrix24, Google Sheets, Telegram, SMTP, MoySklad)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "sinnercode228" }]
keywords = ["webhooks", "integration", "fastapi", "amocrm", "bitrix24", "tilda", "telegram", "moysklad"]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0.2",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "redis>=5.0",
  "aiosmtplib>=3.0",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "fakeredis[lua]>=2.26",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
relay = "relay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["relay"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "C4"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT018", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["relay"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["aiosmtplib.*", "fakeredis.*", "respx.*"]
ignore_missing_imports = true
